<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>Safepay — Protected Payment App</title>
    <meta name="description" content="Pay strangers safely. Safepay locks your payment until delivery is confirmed. No delivery? Full refund. Buyer protection for every online order." />
    <meta name="author" content="Safepay" />
    <meta name="keywords" content="escrow payment, secure online payment, buyer protection, fraud protection, safe payment, payment gateway India" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://safepay-app.lovable.app/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://safepay-app.lovable.app/" />
    <meta property="og:title" content="Safepay — Protected Payment App" />
    <meta property="og:description" content="Pay strangers safely. Safepay locks your payment until delivery is confirmed. No delivery? Full refund." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:site_name" content="Safepay" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://safepay-app.lovable.app/" />
    <meta name="twitter:title" content="Safepay — Protected Payment App" />
    <meta name="twitter:description" content="Pay strangers safely. Safepay locks your payment until delivery is confirmed. No delivery? Full refund." />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#2463EB" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Structured data: Organization + WebSite -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Safepay",
        "url": "https://safepay-app.lovable.app/",
        "logo": "https://safepay-app.lovable.app/favicon.png",
        "description": "Buyer-protected payments — funds are locked until delivery is confirmed.",
        "sameAs": []
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Safepay",
        "url": "https://safepay-app.lovable.app/"
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
